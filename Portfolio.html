<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Nabil Kendri</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body class="inner">

  <header class="site-header">
    <a href="index.html" class="logo">Portfolio.</a>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="About.html">About</a>
      <a href="Portfolio.html" class="active">Portfolio</a>
      <a href="Contact.html">Contact</a>
    </nav>
  </header>

  <main class="full-page">
    <section>
      <h2 class="section-title">Projects</h2>
      <p class="section-subtitle">A selection of work spanning ML systems, data engineering, and software development.</p>
      <div class="projects-grid" id="projects-grid"></div>
    </section>
  </main>

  <script src="projects.js"></script>
  <script>
    var grid = document.getElementById('projects-grid');
    var html = '';

    for (var i = 0; i < projects.length; i++) {
      var p = projects[i];

      var tags = '';
      for (var j = 0; j < p.tags.length; j++) {
        tags += '<span class="proj-tag">' + p.tags[j] + '</span>';
      }

      var links = '';
      if (p.github) {
        links += '<a href="' + p.github + '" target="_blank" rel="noopener" class="proj-link"><i class="ri-github-fill"></i> Code</a>';
      }
      if (p.demo) {
        links += '<a href="' + p.demo + '" target="_blank" rel="noopener" class="proj-link proj-link--demo"><i class="ri-external-link-line"></i> Live Demo</a>';
      }

      html +=
        '<div class="project-card">' +
          '<div class="proj-header">' +
            '<span class="proj-title">' + p.title + '</span>' +
            '<span class="proj-date">' + p.date + '</span>' +
          '</div>' +
          '<div class="proj-tags">' + tags + '</div>' +
          '<p class="proj-desc">' + p.description + '</p>' +
          (links ? '<div class="proj-links">' + links + '</div>' : '') +
        '</div>';
    }

    grid.innerHTML = html;
  </script>
</body>
</html>
